[pt_table]
#partition table is 4K in size
address0 = 0xE000
address1 = 0xF000

[[pt_entry]]
type = 0
name = "FW"
device = 0
address0 = 0x10000
size0 = 0x160000
address1 = 0
size1 = 0
# FW+OTA 两段合并为单段 (0x10000..0x170000): mbedtls 引入后固件 ~961KB,
# 超过原单段 864KB 上限; 本产品不用 OTA, 合并后 app 有 1.4MB 空间。
# 其余分区 (mfg/media/PSM/KEY/DATA/factory) 起始地址不变。
# compressed image must set len,normal image can left it to 0
len = 0

[[pt_entry]]
type = 2
name = "mfg"
device = 0
address0 = 0x170000
size0 = 0x32000
address1 = 0
size1 = 0
